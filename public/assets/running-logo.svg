<svg xmlns="http://www.w3.org/2000/svg" viewBox="980 160 380 460" width="100%" height="100%">
  <defs>
    <filter id="glow-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="runner-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E8AC" />
      <stop offset="100%" stop-color="#ff3131" />
