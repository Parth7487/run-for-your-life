    <path d="M 1261.88 246.21 C 1252.34 269.84 1225.48 281.3 1201.78 271.89 C 1178.15 262.35 1166.64 235.48 1176.17 211.79 C 1185.65 188.1 1212.51 176.58 1236.21 186.12 C 1259.84 195.66 1271.35 222.53 1261.88 246.21 Z" />
